<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Document library</title>
<style>body{font:15px system-ui;color:#1f2a37;background:#f4f7fb;margin:24px auto;max-width:1200px;padding:16px}section,article{background:white;border:1px solid #dbe3ee;border-radius:10px;padding:16px;margin:12px 0}input,select,button,textarea{font:inherit;padding:7px;margin:5px;max-width:100%}button,a{cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:96%;height:360px;font:13px monospace}iframe{width:100%;height:450px;border:1px solid #ddd}.muted{color:#64748b}.row{display:flex;gap:12px;flex-wrap:wrap}.error{color:#b42318}#notice{white-space:pre-wrap}details{margin:10px 0}</style>
<rich-assets>
<rich-shell></rich-shell>
<section><label>Files <input id="files" type="file" multiple></label><label>Folder <input id="folder" type="file" webkitdirectory multiple></label><div id="uploads"></div></section>
<section><form id="search"><input name="q" placeholder="Search text, identifiers, parts, projects"><select name="category" id="category"><option value="">All document types</option></select><select name="status"><option value="">All processing states</option><option>Queued</option><option>Reading / OCR</option><option>Classifying</option><option>Extracting information</option><option>Indexing</option><option>Completed</option><option>Failed</option></select><select name="review_status"><option value="">All review states</option><option>Pending</option><option>Verified</option><option>Needs clarification</option></select><label>From <input type="date" name="date_from"></label><label>To <input type="date" name="date_to"></label><button>Search</button></form><p id="summary"></p><div id="results"></div></section>
<p id="notice" role="status"></p><section id="detail" hidden></section>
<button id="clear-documents" type="button">Clear Library documents</button>
<section><h2>Approved training examples</h2><p>Only explicitly verified, reviewed results are eligible. Export requires the server export token.</p><input id="token" type="password" autocomplete="off" placeholder="Export token"><button id="export">Download JSONL</button></section>
<section><h2>Ask AI beta</h2><p>Ask about completed documents. Answers include evidence and links to the original files.</p><form id="ask"><input id="question" required maxlength="2000" style="width:75%" placeholder="What payment terms are stated for PO 000123?"><button id="askButton">Ask</button></form><div id="answer" aria-live="polite"></div></section>
<script src="/assets/progress.js"></script>
<script>
const $=s=>document.querySelector(s), categories=['Request for Quotation (RFQ)','Purchase Order (PO)','Purchase Requisition (PR)','Design Document','Bill of Materials (BOM)','Quotation','Invoice','Mixed document','Unknown'];
for(const value of categories){const o=document.createElement('option');o.textContent=value;$('#category').append(o)}
function node(tag,text,parent){const el=document.createElement(tag);if(text!==undefined)el.textContent=text;if(parent)parent.append(el);return el}
async function api(url,options){const response=await fetch(url,options);if(!response.ok){let error;try{error=(await response.json()).detail}catch{error='Request failed'}throw Error(typeof error==='string'?error:JSON.stringify(error))}return response.json()}
function fail(e){$('#notice').textContent=e.message}
$('#clear-documents').onclick=async()=>{if(!confirm('Delete all Library documents, extracted results, reviews, and history? These files will no longer be available to the Assistant. Original files and AI Training stay intact.'))return;const button=$('#clear-documents');button.disabled=true;try{const result=await api('/api/library',{method:'DELETE'});$('#uploads').replaceChildren();$('#detail').replaceChildren();$('#detail').hidden=true;$('#answer').replaceChildren();$('#notice').textContent=result.cleared+' Library documents cleared.';await refresh()}catch(e){fail(e)}finally{button.disabled=false}};
$('#ask').onsubmit=async event=>{event.preventDefault();const box=$('#answer');box.replaceChildren();node('p','Looking for supporting evidence…',box);$('#askButton').disabled=true;try{const result=await api('/api/library-ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:$('#question').value})});box.replaceChildren();if(result.message)node('p',result.message,box);for(const claim of result.claims){const paragraph=node('article',undefined,box);node('p',claim.text,paragraph);for(const ref of claim.references){const a=node('a',ref.filename+' · '+JSON.stringify(ref.location)+' · '+ref.review_status+' · Processing: '+ref.processing_status,paragraph);a.href=ref.url;a.target='_blank';a.rel='noopener';node('blockquote',ref.excerpt,paragraph)}}if(result.scope)node('p',result.scope,box).className='muted'}catch(e){box.replaceChildren();node('p',e.message,box)}finally{$('#askButton').disabled=false}};
function link(parent,id,source){const a=node('a',source?JSON.stringify(source.location):'Open original',parent);a.href='/api/library/'+id+'/original'+(source?.location?.page?'#page='+source.location.page:'');a.target='_blank';a.rel='noopener';return a}
async function upload(event){const files=Array.from(event.target.files);$('#files').disabled=$('#folder').disabled=true;try{for(const file of files){try{await DocProgress.upload('/api/library',file,$('#uploads'))}catch(e){fail(e)}await refresh()}}catch(e){fail(e)}finally{event.target.value='';$('#files').disabled=$('#folder').disabled=false}}
$('#files').onchange=upload;$('#folder').onchange=upload;
async function refresh(){const all=await api('/api/library');const counts={Queued:0,Processing:0,Completed:0,Failed:0};for(const r of all)counts[r.status in counts?r.status:'Processing']++;$('#summary').textContent='Total '+all.length+' · '+Object.entries(counts).map(([k,v])=>k+' '+v).join(' · ');const params=new URLSearchParams(new FormData($('#search')));const rows=await api('/api/library?'+params);$('#results').replaceChildren();for(const r of rows){const card=node('article',undefined,$('#results'));node('strong',r.filename,card);const elapsed=r.started?Math.max(0,Math.floor(((r.finished||Date.now()/1000)-r.started))):null;node('p',r.status+' · '+r.review_status+(r.total!=null?' · '+r.done+' of '+r.total+' '+(r.status==='Reading / OCR'?'source pages prepared':'chunks'):'')+(r.started?' · Started '+new Date(r.started*1000).toLocaleString()+' · '+elapsed+'s elapsed':''),card);DocProgress.processing(card,r);if(r.error)node('p',r.error,card).className='error';if(r.source){node('p',r.source.text.slice(0,240),card);link(card,r.id,r.source)}const button=node('button','View results and evidence',card);button.onclick=()=>show(r.id).catch(fail);if(['Failed','Completed'].includes(r.status)){const retry=node('button',r.status==='Failed'?'Retry':'Reprocess',card);retry.onclick=async()=>{try{await api('/api/library/'+r.id+'/retry',{method:'POST'});await refresh()}catch(e){fail(e)}}}}}
async function show(id){const row=await api('/api/library/'+id),box=$('#detail');box.hidden=false;box.replaceChildren();node('h2',row.filename,box);node('p',row.status==='Completed'?(row.review_status==='Verified'?'Verified':'Ready for review'):row.status,box);link(box,id);const frame=node('iframe',undefined,box);frame.title='Original document';frame.sandbox='';frame.src='/api/library/'+id+'/original';const output=row.reviewed||row.machine;if(output){node('h3',output.category,box);node('p','Quality flags: '+(output.quality_flags.join('; ')||'None reported'),box);function refs(parent,evidence){for(const ref of evidence||[]){const source=(row.sources||[]).find(s=>s.id===ref.source_id);const p=node('p',ref.excerpt+' · ',parent);link(p,id,source)}}for(const claim of [...output.summary,...output.tags]){node('p',claim.text,box);refs(box,claim.evidence)}for(const [i,segment]of output.segments.entries()){const section=node('details',undefined,box);node('summary','Segment '+(i+1)+' · '+segment.category,section);refs(section,segment.category_evidence);for(const [key,value]of Object.entries(segment.fields)){if(value){node('strong',key+': '+value.raw+(value.normalized?' → '+value.normalized:''),section);refs(section,value.evidence);if(value.flags.length)node('p',value.flags.join('; '),section)}}for(const item of segment.line_items){const entry=node('article',undefined,section);for(const[key,value]of Object.entries(item))if(value){node('p',key+': '+value.raw,entry);refs(entry,value.evidence)}}}
node('h3','Review and corrections',box);node('p','Edit classification, fields, line items and tags below. Preserve evidence for every populated value. Changes are audited separately from machine output.',box);const advanced=node('details',undefined,box);node('summary','Advanced correction editor',advanced);const editor=node('textarea',undefined,advanced);editor.value=JSON.stringify(output,null,2);editor.setAttribute('aria-label','Reviewed extraction JSON');const actor=node('input',undefined,box);actor.placeholder='Reviewer name';actor.setAttribute('aria-label','Reviewer name');const state=node('select',undefined,box);for(const value of ['Pending','Verified','Needs clarification'])node('option',value,state);state.value=row.review_status;const save=node('button','Save review',box);save.onclick=async()=>{try{await api('/api/library/'+id+'/review',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({output:JSON.parse(editor.value),actor:actor.value,status:state.value})});$('#notice').textContent='Review saved';await show(id);await refresh()}catch(e){fail(e)}}}
const sources=node('details',undefined,box);node('summary','All source text and stable references',sources);for(const source of row.sources||[]){node('h4',source.id,sources);link(sources,id,source);node('pre',source.text,sources)}const history=node('details',undefined,box);node('summary','Processing and review history',history);for(const event of row.history)node('p',new Date(event.at*1000).toLocaleString()+' · Attempt '+event.attempt+' · '+event.event+' · '+event.actor,history);box.scrollIntoView({behavior:'smooth'})}
$('#search').onsubmit=e=>{e.preventDefault();refresh().catch(fail)};
$('#export').onclick=async()=>{try{const r=await fetch('/api/library-export',{headers:{'X-Export-Token':$('#token').value}});if(!r.ok)throw Error('Export denied: check the server export token');const url=URL.createObjectURL(await r.blob());const a=node('a');a.href=url;a.download='approved-examples.jsonl';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);$('#token').value=''}catch(e){fail(e)}};
let polling=false;setInterval(async()=>{if(polling)return;polling=true;try{await refresh()}catch(e){$('#notice').textContent='Connection lost; reconnecting automatically. '+e.message}finally{polling=false}},2000);refresh().catch(fail);
const requestedDocument=new URLSearchParams(location.search).get('document');if(requestedDocument)show(requestedDocument).catch(fail);</script></html>
